name: Build RG Blue Delay Windows VST3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Build Windows VST3
        run: |
          cmake --build build --config Release --parallel 2

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          Get-ChildItem -Path build -Recurse -Directory |
            Where-Object { $_.Name -like "*.vst3" } |
            ForEach-Object {
              Copy-Item $_.FullName "artifacts\$($_.Name)" -Recurse -Force
            }

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: RG-Blue-Delay-Windows-VST3
          path: artifacts/
          if-no-files-found: error
